name: kids_learning_app
description: A free, offline learning app for toddlers (letters A to Z and numbers 1 to 10).
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  flutter_svg: ^2.0.10
  flutter_staggered_grid_view: ^0.7.0  # Metro-style tile grid
  # Milestone 2: pack system
  dio: ^5.4.0              # downloads with progress and cancel
  archive: ^3.6.1          # unzip packs (also used by tools/pack_builder.dart)
  crypto: ^3.0.3           # SHA-256 check of each download
  path_provider: ^2.1.2    # app's private folder on phones
  shared_preferences: ^2.2.2  # list of installed packs
  hive_ce: ^2.0.0         # pack files in the browser (IndexedDB) on web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Content pictures are NOT bundled any more: they arrive in downloaded packs.
  assets:
    - assets/images/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
