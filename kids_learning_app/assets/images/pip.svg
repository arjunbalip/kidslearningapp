<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-label="Pip the owl, the app mascot, waving" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Pip the owl: original mascot concept for the Kids Learning App -->
  <!-- ear tufts -->
  <path d="M52 78 L40 30 L84 62 Z" fill="#C2410C"/>
  <path d="M188 78 L200 30 L156 62 Z" fill="#C2410C"/>
  <!-- left wing (resting) -->
  <ellipse cx="38" cy="160" rx="22" ry="48" transform="rotate(14 38 160)" fill="#C2410C"/>
  <!-- right wing (waving) -->
  <ellipse cx="208" cy="112" rx="20" ry="46" transform="rotate(-38 208 112)" fill="#C2410C"/>
  <!-- body -->
  <ellipse cx="120" cy="150" rx="88" ry="96" fill="#EA580C"/>
  <!-- belly -->
  <ellipse cx="120" cy="182" rx="58" ry="58" fill="#FFE3C2"/>
  <path d="M96 170 q8 8 16 0 M128 170 q8 8 16 0 M112 196 q8 8 16 0" fill="none" stroke="#F4B57A" stroke-width="4" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="86" cy="116" r="32" fill="#FFFFFF"/>
  <circle cx="154" cy="116" r="32" fill="#FFFFFF"/>
  <circle cx="92" cy="120" r="15" fill="#2A2340"/>
  <circle cx="148" cy="120" r="15" fill="#2A2340"/>
  <circle cx="97" cy="114" r="5" fill="#FFFFFF"/>
  <circle cx="153" cy="114" r="5" fill="#FFFFFF"/>
  <!-- cheeks -->
  <circle cx="62" cy="150" r="10" fill="#F9A8D4" opacity="0.8"/>
  <circle cx="178" cy="150" r="10" fill="#F9A8D4" opacity="0.8"/>
  <!-- beak -->
  <path d="M110 140 L130 140 L120 158 Z" fill="#FFC83D"/>
  <!-- feet -->
  <ellipse cx="94" cy="246" rx="18" ry="9" fill="#FFC83D"/>
  <ellipse cx="146" cy="246" rx="18" ry="9" fill="#FFC83D"/>
</svg>
